name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: nothing here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    name: reference implementation (tilegen.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      # cairosvg reaches libcairo through ctypes, so the Python package alone
      # is not enough. Without it selftest's orientation section skips rather
      # than fails, which would quietly leave a check unrun in CI.
      - name: Install libcairo
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run selftest
        run: python selftest.py

      # tilegen.py is the reference the browser suite is measured against, so
      # its recorded expectations have to track it. Regenerating and diffing
      # catches a change to the Python that nobody propagated.
      - name: expected.json is in sync with tilegen.py
        run: |
          python webjs/tests/run.py --update
          if ! git diff --quiet -- webjs/tests/expected.json; then
            echo "::error::webjs/tests/expected.json is stale. Run:"
            echo "::error::  python3 webjs/tests/run.py --update"
            git --no-pager diff -- webjs/tests/expected.json
            exit 1
          fi
          echo "expected.json matches tilegen.py"

  browser:
    name: browser implementation (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The runner image ships Google Chrome, and the run mode of the harness
      # is stdlib-only -- it needs tilegen's dependencies only for --update.
      # So this job installs nothing.
      - name: Show Chrome version
        run: google-chrome --version

      - name: Run the browser suite
        run: python3 webjs/tests/run.py
